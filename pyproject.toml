[tool.poetry]
name = "sparsh-medical-be"
version = "1.0.0"
description = "Sparsh Medical store backend (FastAPI + MongoDB)"
authors = ["iauro"]
readme = "README.md"
# A deployable application, not a distributable library.
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "0.115.1"
uvicorn = { version = "0.35.0", extras = ["standard"] }
pydantic = "^2.12"
python-dotenv = "1.1.1"
pymongo = "4.13.2"
motor = "3.7.1"
pyjwt = "2.10.1"
pillow = "^11.3"
python-multipart = "0.0.20"
google-auth = "^2.40"
requests = "^2.32"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
